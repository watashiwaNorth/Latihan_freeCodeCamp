<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans — North Vision Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Pricing Plans</h1>
    <div class="pricing-container">
        <!-- Paket Basic -->
        <div class="pricing-card basic-plan">
            <h2>Basic</h2>
            <p>$9/month</p>
            <ul>
                <li>10 GB penyimpanan</li>
                <li>1 pengguna</li>
                <li>Dukungan email</li>
            </ul>
        </div>

        <!-- Paket Pro -->
        <div class="pricing-card pro-plan">
            <h2>Pro</h2>
            <p>$19/month</p>
            <ul>
                <li>100 GB penyimpanan</li>
                <li>5 pengguna</li>
                <li>Prioritas dukungan</li>
            </ul>
        </div>

        <!-- Paket Premium -->
        <div class="pricing-card premium-plan">
            <h2>Premium</h2>
            <p>$29/month</p>
            <ul>
                <li>1 TB penyimpanan</li>
                <li>Pengguna tak terbatas</li>
                <li>Dukungan 24/7</li>
            </ul>
        </div>
    </div>
</body>
</html>
