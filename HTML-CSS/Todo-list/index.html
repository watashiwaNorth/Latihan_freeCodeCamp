<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <ul class="todo-list">
        <li> 
            <input type="checkbox" id="belajar-list" /> 
            <label for="belajar-list">Belajar</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.google.com/" target="_blank">google</a></li>
            </ul>
        </li>

        <li> 
            <input type="checkbox" id="istirahat-list" /> 
            <label for="istirahat-list">Istirahat</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.youtube.com/" target="_blank">youtube</a></li>
            </ul>
        </li>

        <li> 
            <input type="checkbox" id="programmer-list" /> 
            <label for="programmer-list">Programmer</label> 
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.youtube.com/" target="_blank">course</a></li>
            </ul>
        </li>

        <li> 
            <input type="checkbox" id="japanese-list" /> 
            <label for="japanese-list">Japanese</label> 
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.youtube.com/" target="_blank">study</a></li>
            </ul>
        </li>
    </ul> 

</body>
</html>
