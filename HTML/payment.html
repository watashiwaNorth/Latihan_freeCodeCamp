<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Page</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f8f9fa;
            color: #333;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            border: 2px dashed #ccc;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        h1, h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        fieldset {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #333;
            font-family: inherit;
        }

        #card-number-help {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }

        .required-star {
            color: red;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <h1>Receipt / Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <div class="cart-item">
            <div>
                <p><strong>Retro Rubik's Cube</strong></p>
                <p>Qty: 1x</p>
            </div>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Some rubik with random section"> 
        </div>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form id="checkout-form" onsubmit="processPayment(event)">
            
            <fieldset>
                <legend>Method: Card Payment</legend>
                
                <div class="form-group">
                    <label for="card-name">Cardholder Name <span class="required-star" aria-hidden="true">*</span></label>
                    <input type="text" id="card-name" name="card-name" placeholder="e.g., John Doe" required />
                </div>

                <div class="form-group">
                    <label for="card-number">Card Number <span class="required-star" aria-hidden="true">*</span></label>
                    <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" placeholder="12345678" required />
                    <p id="card-number-help">Immediately after input: Please input name and password combination securely.</p>
                </div>

            </fieldset>

            <button type="submit">Process Payment</button>
        </form>
    </section>

    <script>
        function processPayment(event) {
            event.preventDefault();
            const name = document.getElementById('card-name').value;
            alert(`⚡ Payment Approved!\nThank you, ${name}. Your receipt has been generated.`);
        }
    </script>

</body>
</html>
