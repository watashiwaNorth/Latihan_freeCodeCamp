<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 2</title>
</head>
<body>
    <h1>Soal 2</h1>
    <p><b>Cerita:</b><br>
    Sebuah roket akan diluncurkan. Hitung mundur dari 5 ke 1, lalu cetak "Go!".<br>
    <b>Instruksi:</b><br>
    <ul>
        <li>Gunakan perulangan while.</li>
        <li>Mulai dengan variabel hitungan = 5.</li>
        <li>Selama hitungan > 0, cetak nilai hitungan, lalu kurangi 1.</li>
        <li>Setelah perulangan selesai, cetak "Go!".</li>
    </ul>
    </p>
    <script>
        let hitungan = 5;
        while (hitungan > 0) {
            console.log(hitungan);
            hitungan--;
        }
        console.log("Go!");
    </script>
</body>
</html>
